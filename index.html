<style>
:root{--bg:#07111f;--panel:#0d1d31;--panel2:#112844;--line:#294463;--txt:#edf6ff;--muted:#9db0c7;--green:#24d58a;--blue:#42b6ff;--yellow:#ffc34d;--red:#ff647c;--purple:#b98cff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07111f,#08182b);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:10;background:#081527f2;border-bottom:1px solid #1c314b;padding:14px 16px;display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#20d990,#1687db);display:grid;place-items:center;font-size:26px}.brand{flex:1}.brand b{font-size:20px}.brand small{display:block;color:var(--muted)}.cash{text-align:right;color:var(--green);font-weight:800}.cash small{display:block;color:var(--yellow)}.menuBtn,.close{width:46px;height:46px;border-radius:14px;border:1px solid #54708e;background:#102642;color:#fff;font-size:25px}.content{padding:18px 14px}.hero h1{margin:0 0 4px;font-size:28px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.stat,.card{background:linear-gradient(145deg,#0d1f34,#0b192b);border:1px solid var(--line);border-radius:18px;padding:15px}.stat span{display:block;color:var(--muted);font-size:13px}.stat b{display:block;margin-top:6px;font-size:21px}.green{color:var(--green)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}.red{color:var(--red)}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}.sectionHead h2{font-size:20px;margin:0}.badge{padding:5px 9px;border-radius:20px;background:#17314e;color:#cfe7ff;font-size:12px}.card{margin-bottom:10px}.card h3{margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750;color:#07111f;background:var(--green)}.btn.blue{background:var(--blue);color:#061321}.btn.yellow{background:var(--yellow);color:#231800}.btn.red{background:var(--red);color:#26050b}.btn.ghost{background:#152b45;color:#e7f2ff;border:1px solid #365475}.btn:disabled{opacity:.45}.progress{height:8px;background:#06101d;border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:9px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid #35516f;background:#10233b;color:#dcecff;border-radius:22px;padding:8px 12px}.chip.on{background:#176a62;border-color:#29d5a1}.field{width:100%;border:1px solid #35516f;background:#081628;color:#fff;border-radius:12px;padding:11px;margin-top:8px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:#071425ee;border-top:1px solid #203750;display:flex;justify-content:center;padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom))}.navin{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:#91a5bd;padding:6px 2px;font-size:11px}.nav button i{font-style:normal;display:block;font-size:22px}.nav button.on{color:var(--green)}.drawer{position:fixed;inset:0;z-index:30;background:#020813aa;display:none}.drawer.on{display:block}.sheet{height:100%;width:min(86%,430px);margin-left:auto;background:#0a192b;padding:20px;overflow:auto;border-left:1px solid #38516e}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.menuItem{display:block;width:100%;text-align:left;color:#e9f5ff;background:#102845;border:1px solid #1e3a58;border-radius:14px;padding:14px;margin:8px 0;font-weight:700}.modal{position:fixed;inset:0;z-index:40;background:#020813cc;display:none;align-items:flex-end}.modal.on{display:flex}.modalBox{width:min(760px,100%);margin:auto;background:#0b1b2e;border:1px solid #34516f;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead h2{margin:0}.service{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-bottom:1px solid #203750}.empty{text-align:center;color:var(--muted);padding:32px 12px}.toast{position:fixed;z-index:80;left:50%;bottom:90px;transform:translateX(-50%);background:#17324a;border:1px solid #3c6384;padding:12px 16px;border-radius:13px;display:none;max-width:90%;text-align:center}.toast.on{display:block}.tag{display:inline-block;border-radius:9px;padding:4px 7px;font-size:11px;background:#17324a;color:#bcd7ef}.tag.ok{background:#0d4b3b;color:#7cf0bf}.tag.wait{background:#4c3910;color:#ffd66d}.tag.bad{background:#4a1b29;color:#ff94a5}@media(max-width:380px){.brand b{font-size:17px}.cash{font-size:13px}.content{padding:14px 10px}.stat{padding:12px}.stat b{font-size:17px}}
</style></head>
<body><div class="app"><header class="top"><div class="logo">🔧</div><div class="brand"><b>AUTO CENTER BRASIL</b><small>Oficina completa · V1.2</small></div><div class="cash" id="topCash"></div><button class="menuBtn" onclick="toggleMenu()">☰</button></header><main class="content" id="view"></main></div>
<nav class="nav"><div class="navin" id="nav"></div></nav><div class="drawer" id="drawer" onclick="if(event.target===this)toggleMenu()"><aside class="sheet"><div class="sheetHead"><div><b style="font-size:21px">Gestão do Auto Center</b><div class="sub">Todos os setores</div></div><button class="close" onclick="toggleMenu()">×</button></div><div id="menu"></div></aside></div><div class="modal" id="modal"><div class="modalBox" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='auto_center_brasil_v1';
const services=[
 {id:'oleo',sector:'Mecânica',name:'Troca de óleo e filtro',price:320,cost:125,time:1,parts:{'Óleo 5W30':4,'Filtro de óleo':1}},
 {id:'freio',sector:'Mecânica',name:'Pastilhas e revisão de freios',price:780,cost:330,time:2,parts:{'Pastilha de freio':1}},
 {id:'revisao',sector:'Mecânica',name:'Revisão completa',price:650,cost:90,time:2,parts:{'Filtro de ar':1}},
 {id:'susp',sector:'Mecânica',name:'Reparo de suspensão',price:1450,cost:620,time:4,parts:{'Kit suspensão':1}},
 {id:'pneu',sector:'Borracharia',name:'Troca de 2 pneus',price:1250,cost:790,time:1,parts:{'Pneu aro 15':2}},
 {id:'alinhar',sector:'Borracharia',name:'Alinhamento e balanceamento',price:180,cost:25,time:1,parts:{}},
 {id:'furo',sector:'Borracharia',name:'Conserto de pneu furado',price:75,cost:12,time:1,parts:{}},
 {id:'lavar',sector:'Lavagem',name:'Lavagem completa',price:95,cost:18,time:1,parts:{'Shampoo automotivo':1}},
 {id:'detalhe',sector:'Lavagem',name:'Higienização e detalhamento',price:480,cost:95,time:3,parts:{'Kit limpeza':1}},
 {id:'polir',sector:'Pintura',name:'Polimento técnico',price:700,cost:140,time:3,parts:{'Massa de polir':1}},
 {id:'pintar',sector:'Pintura',name:'Pintura de peça',price:1200,cost:390,time:5,parts:{'Tinta automotiva':1}},
 {id:'lataria',sector:'Lanternagem',name:'Reparo de amassado',price:980,cost:210,time:4,parts:{'Material de funilaria':1}},
 {id:'colisao',sector:'Lanternagem',name:'Reparo de colisão',price:3200,cost:1150,time:8,parts:{'Material de funilaria':2,'Tinta automotiva':1}}
];
const initialStock={'Óleo 5W30':24,'Filtro de óleo':8,'Filtro de ar':8,'Pastilha de freio':6,'Kit suspensão':3,'Pneu aro 15':12,'Shampoo automotivo':15,'Kit limpeza':6,'Massa de polir':5,'Tinta automotiva':6,'Material de funilaria':8};
const stockPrice={'Óleo 5W30':28,'Filtro de óleo':45,'Filtro de ar':58,'Pastilha de freio':250,'Kit suspensão':540,'Pneu aro 15':370,'Shampoo automotivo':16,'Kit limpeza':80,'Massa de polir':110,'Tinta automotiva':310,'Material de funilaria':175};
const equipment=[{id:'scanner',name:'Scanner automotivo',sector:'Mecânica',price:18000,bonus:.10},{id:'elevador',name:'Elevador hidráulico',sector:'Mecânica',price:35000,bonus:.20},{id:'alinhador',name:'Alinhador computadorizado',sector:'Borracharia',price:26000,bonus:.25},{id:'lavadora',name:'Lavadora profissional',sector:'Lavagem',price:14000,bonus:.25},{id:'cabine',name:'Cabine de pintura',sector:'Pintura',price:65000,bonus:.25},{id:'spotter',name:'Máquina Spotter',sector:'Lanternagem',price:32000,bonus:.20}];
const names=['Mariana Souza','Carlos Almeida','Rafael Lima','Fernanda Costa','João Martins','Patrícia Rocha','Lucas Ribeiro','Aline Santos','Bruno Alves','Camila Nunes'];
const cars=['Chevrolet Onix','Hyundai HB20','Fiat Argo','Volkswagen T-Cross','Toyota Corolla','Honda Civic','Jeep Renegade','Renault Kwid','Fiat Toro','Chevrolet Tracker'];
const plates=['BRA','ABC','QWE','RTA','MEC','AUT','CAR','FIX'];
function fresh(){return{version:1.1,cash:20000000,cashBoostV11:true,day:1,month:1,year:2026,hour:8,reputation:3.5,xp:0,customers:0,completed:0,revenue:0,expenses:0,orders:[],stock:{...initialStock},staff:[{id:1,name:'Marcos Silva',sector:'Mecânica',skill:2,salary:3400,busy:0},{id:2,name:'Diego Costa',sector:'Borracharia',skill:2,salary:3400,busy:0},{id:3,name:'Ana Lima',sector:'Lavagem',skill:2,salary:3400,busy:0},{id:4,name:'Paulo Reis',sector:'Pintura',skill:2,salary:3400,busy:0},{id:5,name:'Renato Alves',sector:'Lanternagem',skill:2,salary:3400,busy:0}],bays:{'Mecânica':2,'Borracharia':1,'Lavagem':2,'Pintura':1,'Lanternagem':1},ledger:[{day:1,month:1,year:2026,type:'Entrada',desc:'Capital inicial',value:20000000}],lastSeen:Date.now(),nextId:1};}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}if(!S.cashBoostV11){let add=20000000-S.cash;S.cash=20000000;S.cashBoostV11=true;S.version=1.1;S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Entrada',desc:'Aporte de capital V1.1',value:add})}S.equipment=S.equipment||[];S.bank=S.bank||{investment:0,loanBalance:0,installments:0,payment:0};S.usedCars=S.usedCars||[];S.tireReform=S.tireReform||{worn:0,punctured:0,ready:0,scrap:0};S.history=S.history||[];S.suppliers=S.suppliers||{preferred:'Padrão'};S.version=1.2;let page='home',filter='Todos';
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}function save(){S.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(S));header()}function header(){document.getElementById('topCash').innerHTML=money(S.cash)+'<small>Dia '+S.day+' · '+String(S.hour).padStart(2,'0')+':00</small>'}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('on'),2300)}
function status(o){return({waiting:'Aguardando diagnóstico',quote:'Orçamento pronto',approved:'Aguardando execução',working:'Em serviço',done:'Pronto para entregar'}[o.status]||o.status)}
function statusTag(o){let c=o.status==='done'?'ok':o.status==='working'?'wait':'';return '<span class="tag '+c+'">'+status(o)+'</span>'}
function vehicle(){return cars[Math.floor(Math.random()*cars.length)]+' · '+plates[Math.floor(Math.random()*plates.length)]+'-'+(1000+Math.floor(Math.random()*9000))}
function newCustomer(source){let ids=services.map(x=>x.id), count=1+Math.floor(Math.random()*3), chosen=[];while(chosen.length<count){let x=ids[Math.floor(Math.random()*ids.length)];if(!chosen.includes(x))chosen.push(x)}let origins=['Particular','Seguradora','Frota empresarial'],origin=source||origins[Math.floor(Math.random()*origins.length)];let o={id:S.nextId++,client:origin==='Particular'?names[Math.floor(Math.random()*names.length)]:origin==='Seguradora'?'Seguradora Protege Auto':'Frota Empresa Parceira',origin,vehicle:vehicle(),km:10000+Math.floor(Math.random()*180000),complaint:['barulho estranho','revisão preventiva','carro puxando para o lado','vibração ao dirigir','limpeza e valorização','dano na lataria'][Math.floor(Math.random()*6)],suggested:chosen,selected:[],status:'waiting',remaining:0,created:`${S.day}/${S.month}/${S.year}`};S.orders.unshift(o);save();render();toast('Novo veículo chegou: '+origin)}
function orderTotal(o){return o.selected.reduce((n,id)=>n+(services.find(s=>s.id===id)?.price||0),0)}function orderCost(o){return o.selected.reduce((n,id)=>n+(services.find(s=>s.id===id)?.cost||0),0)}
function hasParts(o){for(let id of o.selected){let sv=services.find(s=>s.id===id);for(let [p,q] of Object.entries(sv.parts))if((S.stock[p]||0)<q)return false}return true}
function diagnose(id){openDiagnosis(id)}
function approve(id){let o=S.orders.find(x=>x.id===id);o.status='approved';save();render();toast('Cliente aprovou o orçamento completo')}
function negotiate(id){let o=S.orders.find(x=>x.id===id);if(o.selected.length>1){let removed=o.selected.pop();o.status='approved';save();render();toast('Cliente negociou e retirou: '+services.find(s=>s.id===removed).name)}else approve(id)}
function sectorBonus(sec){return S.equipment.filter(id=>equipment.find(x=>x.id===id)?.sector===sec).reduce((n,id)=>n+(equipment.find(x=>x.id===id)?.bonus||0),0)}
function startOrder(id){let o=S.orders.find(x=>x.id===id);if(!hasParts(o)){toast('Faltam peças no estoque');return}let sectors=[...new Set(o.selected.map(id=>services.find(s=>s.id===id).sector))];let unavailable=sectors.find(sec=>S.staff.filter(e=>e.sector===sec&&e.busy<=0).length<1);if(unavailable){toast('Sem funcionário livre em '+unavailable);return}for(let sid of o.selected){let sv=services.find(s=>s.id===sid);for(let [p,q] of Object.entries(sv.parts))S.stock[p]-=q}o.remaining=Math.max(1,Math.ceil(Math.max(...o.selected.map(id=>{let sv=services.find(s=>s.id===id);return sv.time*(1-sectorBonus(sv.sector))}))));o.status='working';sectors.forEach(sec=>{let e=S.staff.find(e=>e.sector===sec&&e.busy<=0);if(e)e.busy=o.remaining});S.expenses+=orderCost(o);S.cash-=orderCost(o);S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Materiais OS #'+o.id,value:-orderCost(o)});save();render();toast('Serviço iniciado')}
function deliver(id){let o=S.orders.find(x=>x.id===id),total=orderTotal(o),rating=Math.max(3,Math.min(5,Math.round((3.5+Math.random()*1.7)*10)/10));S.cash+=total;S.revenue+=total;S.completed++;S.customers++;S.xp+=o.selected.length*12;S.reputation=Math.min(5,(S.reputation*4+rating)/5);S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Receita',desc:'OS #'+o.id+' · '+o.vehicle,value:total});S.history.unshift({...o,total,rating,warranty:30,delivered:`${S.day}/${S.month}/${S.year}`});S.orders=S.orders.filter(x=>x.id!==id);save();render();toast('Entregue! Cliente avaliou com '+rating+' estrelas')}
function tickHour(){S.hour++;S.staff.forEach(e=>e.busy=Math.max(0,e.busy-1));S.orders.filter(o=>o.status==='working').forEach(o=>{o.remaining--;if(o.remaining<=0)o.status='done'});if(S.hour>=19){S.hour=8;S.day++;if(S.day>30){S.day=1;S.month++;let wages=S.staff.reduce((n,e)=>n+(e.salary||3400),0);S.cash-=wages;S.expenses+=wages;S.ledger.unshift({day:1,month:S.month,year:S.year,type:'Despesa',desc:'Folha de pagamento',value:-wages});if(S.bank.investment>0){let gain=Math.round(S.bank.investment*.008);S.bank.investment+=gain;S.ledger.unshift({day:1,month:S.month,year:S.year,type:'Rendimento',desc:'Rendimento do investimento',value:gain})}if(S.bank.installments>0){let pay=Math.min(S.bank.payment,S.bank.loanBalance);S.cash-=pay;S.expenses+=pay;S.bank.loanBalance-=pay;S.bank.installments--;S.ledger.unshift({day:1,month:S.month,year:S.year,type:'Despesa',desc:'Parcela do empréstimo bancário',value:-pay})}if(S.month>12){S.month=1;S.year++}}}}
function advance(hours=1){for(let h=0;h<hours;h++)tickHour();save();render()}
function buyPart(p,q=5){let mode=S.suppliers.preferred||'Padrão',factor=mode==='Econômico'?.9:mode==='Premium'?1.1:1,extra=mode==='Premium'?1:0,cost=Math.round(stockPrice[p]*q*factor);if(S.cash<cost){toast('Saldo insuficiente');return}S.cash-=cost;S.expenses+=cost;S.stock[p]=(S.stock[p]||0)+q+extra;S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:`Compra ${mode}: ${q+extra}x ${p}`,value:-cost});save();render();toast((q+extra)+' unidades recebidas do fornecedor '+mode)}
const pages=[['home','🏠','Início'],['orders','📋','Ordens'],['team','👨‍🔧','Equipe'],['stock','📦','Estoque'],['finance','💳','Finanças']];
function nav(){document.getElementById('nav').innerHTML=pages.map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');document.getElementById('menu').innerHTML=[...pages,['sectors','🏭','Setores e expansão'],['equipment','🛠️','Equipamentos'],['suppliers','🚚','Fornecedores'],['reformer','🛞','Reformadora de pneus'],['usedcars','🚘','Compra e revenda'],['history','⭐','Clientes e garantias'],['bank','🏦','Banco'],['catalog','🧾','Tabela de serviços'],['settings','⚙️','Salvar e configurações']].map(x=>`<button class="menuItem" onclick="go('${x[0]}');toggleMenu()">${x[1]} ${x[2]}</button>`).join('')}
function go(p){page=p;render()}function toggleMenu(){document.getElementById('drawer').classList.toggle('on')}
function home(){let active=S.orders.filter(o=>o.status==='working').length,pending=S.orders.filter(o=>o.status!=='working'&&o.status!=='done').length;return `<section class="hero"><h1>Minha oficina</h1><p>Inspecione, desmonte, troque as peças e teste cada veículo.</p></section><div class="grid"><div class="stat"><span>Caixa disponível</span><b class="green">${money(S.cash)}</b></div><div class="stat"><span>Reputação</span><b class="yellow">★ ${S.reputation.toFixed(1)}</b></div><div class="stat"><span>Serviços concluídos</span><b class="blue">${S.completed}</b></div><div class="stat"><span>Carros na oficina</span><b>${S.orders.length}</b></div></div><div class="row"><span class="badge">⏱ 1 minuto real = 1 hora no jogo</span></div><div class="row" style="margin-top:12px"><button class="btn blue" onclick="newCustomer()">🚗 Receber carro</button><button class="btn yellow" onclick="towVehicle()">🚨 Chamar guincho</button><button class="btn ghost" onclick="advance(1)">Avançar 1 hora</button></div><div class="sectionHead"><h2>Elevadores e pátio</h2><span class="badge">${pending} aguardando</span></div>${S.orders.slice(0,5).map(orderCard).join('')||'<div class="empty">Nenhum veículo no pátio.<br>Receba o primeiro carro.</div>'}`}
function orderCard(o){let action=o.status==='waiting'?`<button class="btn blue" onclick="diagnose(${o.id})">Diagnosticar</button>`:o.status==='quote'?`<div class="row"><button class="btn ghost" onclick="negotiate(${o.id})">Negociar</button><button class="btn yellow" onclick="approve(${o.id})">Aprovar tudo</button></div>`:o.status==='approved'?`<button class="btn" onclick="startOrder(${o.id})">Iniciar serviço</button>`:o.status==='working'?`<span class="sub">⏱ ${o.remaining}h restantes</span>`:`<button class="btn" onclick="deliver(${o.id})">Entregar e receber</button>`;return `<article class="card"><div class="row between"><h3>OS #${o.id} · ${o.client}</h3>${statusTag(o)}</div><div class="sub">🚗 ${o.vehicle} · ${o.km.toLocaleString('pt-BR')} km · ${o.origin||'Particular'}</div><p>Relato: ${o.complaint}</p>${o.selected.length?`<div class="sub">${o.selected.map(id=>services.find(s=>s.id===id).name).join(' • ')}</div><div class="row between" style="margin-top:10px"><b class="green">${money(orderTotal(o))}</b>${action}</div>`:`<div class="row between"><span class="sub">Aguardando avaliação</span>${action}</div>`}</article>`}
function orders(){let opts=['Todos','Aguardando','Em serviço','Prontos'];let arr=S.orders.filter(o=>filter==='Todos'||filter==='Aguardando'&&['waiting','quote','approved'].includes(o.status)||filter==='Em serviço'&&o.status==='working'||filter==='Prontos'&&o.status==='done');return `<section class="hero"><h1>Ordens de serviço</h1><p>${S.orders.length} veículos no pátio</p></section><div class="chips" style="margin:16px 0">${opts.map(x=>`<button class="chip ${filter===x?'on':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div>${arr.map(orderCard).join('')||'<div class="empty">Nenhuma ordem neste filtro.</div>'}`}
function severance(e){return Math.round((e.salary||3400)*2+(e.skill||1)*500)}
function team(){let sectors=Object.keys(S.bays);return `<section class="hero"><h1>Equipe</h1><p>${S.staff.length} funcionários contratados · folha ${money(S.staff.reduce((n,e)=>n+(e.salary||3400),0))}</p></section>${sectors.map(sec=>{let list=S.staff.filter(e=>e.sector===sec);return `<div class="sectionHead"><h2>${sec}</h2><span class="badge">${list.length} funcionário(s)</span></div>${list.map(e=>`<article class="card"><div class="row between"><div><h3>👨‍🔧 ${e.name}</h3><div class="sub">Habilidade nível ${e.skill} · salário ${money(e.salary||3400)}</div></div><span class="tag ${e.busy?'wait':'ok'}">${e.busy?'Ocupado '+e.busy+'h':'Disponível'}</span></div><div class="row between" style="margin-top:12px"><span class="sub">Direitos na demissão: ${money(severance(e))}</span><button class="btn red" ${e.busy?'disabled':''} onclick="fireEmployee(${e.id})">Demitir</button></div></article>`).join('')||'<div class="card sub">Nenhum funcionário neste setor.</div>'}`}).join('')}<button class="btn blue" onclick="hire()">+ Contratar funcionário</button>`}
function hire(){let sector=prompt('Setor: Mecânica, Borracharia, Lavagem, Pintura ou Lanternagem');if(!S.bays[sector])return toast('Setor inválido');if(S.cash<12000)return toast('Saldo insuficiente');S.cash-=12000;S.expenses+=12000;S.staff.push({id:Date.now(),name:names[Math.floor(Math.random()*names.length)],sector,skill:1,salary:3100,busy:0});S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Contratação · '+sector,value:-12000});save();render();toast('Novo funcionário contratado')}
function fireEmployee(id){let e=S.staff.find(x=>x.id===id);if(!e)return;if(e.busy>0)return toast('Não é possível demitir durante um serviço');let rights=severance(e);if(S.cash<rights)return toast('Saldo insuficiente para pagar os direitos');if(!confirm(`Demitir ${e.name} e pagar ${money(rights)} de direitos?`))return;S.cash-=rights;S.expenses+=rights;S.staff=S.staff.filter(x=>x.id!==id);S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Rescisão e direitos · '+e.name,value:-rights});save();render();toast('Funcionário demitido e direitos pagos')}
function stock(){return `<section class="hero"><h1>Estoque e compras</h1><p>Peças e materiais usados nas ordens.</p></section><div class="sectionHead"><h2>Itens</h2><span class="badge">${Object.keys(S.stock).length} tipos</span></div>${Object.keys(S.stock).map(p=>`<article class="card"><div class="row between"><div><h3>${p}</h3><div class="sub">Custo unitário ${money(stockPrice[p])}</div></div><b class="${S.stock[p]<3?'red':'green'}">${S.stock[p]} un.</b></div><button class="btn ghost" style="margin-top:10px" onclick="buyPart('${p}',5)">Comprar 5 · ${money(stockPrice[p]*5)}</button></article>`).join('')}`}
function finance(){let profit=S.revenue-S.expenses;return `<section class="hero"><h1>Financeiro</h1><p>Histórico completo de entradas e saídas.</p></section><div class="grid"><div class="stat"><span>Receitas</span><b class="green">${money(S.revenue)}</b></div><div class="stat"><span>Despesas</span><b class="red">${money(S.expenses)}</b></div><div class="stat"><span>Resultado</span><b class="${profit>=0?'green':'red'}">${money(profit)}</b></div><div class="stat"><span>Caixa</span><b class="blue">${money(S.cash)}</b></div></div><div class="sectionHead"><h2>Lançamentos</h2></div>${S.ledger.slice(0,40).map(l=>`<article class="card"><div class="row between"><div><b>${l.desc}</b><div class="sub">${l.day}/${l.month}/${l.year} · ${l.type}</div></div><b class="${l.value>=0?'green':'red'}">${money(l.value)}</b></div></article>`).join('')}`}
function expansionCost(s){return S.bays[s]*12000}
function sectors(){return `<section class="hero"><h1>Setores e expansão</h1><p>Aumente a capacidade simultânea com valores reduzidos.</p></section>${Object.entries(S.bays).map(([s,n])=>`<article class="card"><div class="row between"><div><h3>${s}</h3><div class="sub">${n} vaga(s) de serviço</div></div><button class="btn yellow" onclick="expand('${s}')">Expandir · ${money(expansionCost(s))}</button></div></article>`).join('')}`}
function expand(s){let c=expansionCost(s);if(S.cash<c)return toast('Saldo insuficiente');S.cash-=c;S.expenses+=c;S.bays[s]++;S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Expansão · '+s,value:-c});save();render();toast('Setor expandido')}
function openDiagnosis(id){let o=S.orders.find(x=>x.id===id);if(!o.diagnosis){let ids=[...o.suggested];[...services].sort(()=>Math.random()-.5).forEach(s=>{if(ids.length<7&&!ids.includes(s.id))ids.push(s.id)});o.diagnosis=ids.map(id=>({id,condition:o.suggested.includes(id)?5+Math.floor(Math.random()*30):55+Math.floor(Math.random()*46),inspected:false}));o.selected=[]}showDiagnosis(id)}
function showDiagnosis(id){let o=S.orders.find(x=>x.id===id),box=document.getElementById('modalBox');box.innerHTML=`<div class="modalHead"><div><h2>🔧 Elevador · OS #${o.id}</h2><div class="sub">${o.vehicle}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="card" style="text-align:center;font-size:64px;margin-top:14px">🚘<div class="sub">Toque nos componentes para inspecionar</div></div>${o.diagnosis.map(d=>{let s=services.find(x=>x.id===d.id),bad=d.condition<40;return `<div class="service"><div><b>${s.name}</b><div class="sub">${s.sector} · ${d.inspected?(bad?'❌ Defeito encontrado · '+d.condition+'%':'✅ Bom estado · '+d.condition+'%'):'❓ Não inspecionado'}</div></div>${!d.inspected?`<button class="btn blue" onclick="inspectPart(${id},'${d.id}')">Inspecionar</button>`:bad?`<button class="btn ${o.selected.includes(d.id)?'red':'yellow'}" onclick="toggleRepair(${id},'${d.id}')">${o.selected.includes(d.id)?'Remover':'Reparar'}</button>`:'<span class="tag ok">Aprovado</span>'}</div>`}).join('')}<div class="row between" style="margin-top:15px"><b>Orçamento: ${money(orderTotal(o))}</b><button class="btn" onclick="finishDiagnosis(${id})">Montar orçamento</button></div>`;document.getElementById('modal').classList.add('on')}
function inspectPart(id,sid){let o=S.orders.find(x=>x.id===id),p=o.diagnosis.find(x=>x.id===sid);p.inspected=true;showDiagnosis(id)}
function toggleRepair(id,sid){let o=S.orders.find(x=>x.id===id);o.selected=o.selected.includes(sid)?o.selected.filter(x=>x!==sid):[...o.selected,sid];showDiagnosis(id)}
function finishDiagnosis(id){let o=S.orders.find(x=>x.id===id);if(!o.selected.length)return toast('Selecione ao menos um reparo necessário');o.status='quote';closeModal();save();render();toast('Diagnóstico concluído e orçamento montado')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function towVehicle(){if(S.cash<350)return toast('Saldo insuficiente para o guincho');S.cash-=350;S.expenses+=350;newCustomer('Guincho');let o=S.orders[0];o.complaint='veículo imobilizado com pane';o.suggested=[services[Math.floor(Math.random()*4)].id];S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Guincho para veículo com pane',value:-350});save();render()}
function equipmentPage(){return `<section class="hero"><h1>Ferramentas e equipamentos</h1><p>Equipamentos reduzem o tempo de execução do setor.</p></section>${equipment.map(e=>`<article class="card"><div class="row between"><div><h3>🛠️ ${e.name}</h3><div class="sub">${e.sector} · ${(e.bonus*100).toFixed(0)}% mais rápido</div></div>${S.equipment.includes(e.id)?'<span class="tag ok">Comprado</span>':`<button class="btn yellow" onclick="buyEquipment('${e.id}')">${money(e.price)}</button>`}</div></article>`).join('')}`}
function buyEquipment(id){let e=equipment.find(x=>x.id===id);if(S.equipment.includes(id))return;if(S.cash<e.price)return toast('Saldo insuficiente');S.cash-=e.price;S.expenses+=e.price;S.equipment.push(id);S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Equipamento · '+e.name,value:-e.price});save();render();toast(e.name+' instalado')}
function suppliers(){let modes=[['Econômico','10% mais barato · entrega normal'],['Padrão','Preço normal · entrega imediata'],['Premium','10% mais caro · recebe 1 unidade extra']];return `<section class="hero"><h1>Fornecedores</h1><p>Escolha quem fornecerá suas próximas compras.</p></section>${modes.map(m=>`<article class="card"><div class="row between"><div><h3>🚚 ${m[0]}</h3><div class="sub">${m[1]}</div></div><button class="btn ${S.suppliers.preferred===m[0]?'':'ghost'}" onclick="chooseSupplier('${m[0]}')">${S.suppliers.preferred===m[0]?'Selecionado':'Selecionar'}</button></div></article>`).join('')}`}
function chooseSupplier(x){S.suppliers.preferred=x;save();render();toast('Fornecedor '+x+' selecionado')}
function reformer(){let r=S.tireReform;return `<section class="hero"><h1>Reformadora de pneus</h1><p>Recupere pneus usados ou encaminhe os irrecuperáveis para sucata.</p></section><div class="grid"><div class="stat"><span>Carecas</span><b>${r.worn}</b></div><div class="stat"><span>Furados</span><b>${r.punctured}</b></div><div class="stat"><span>Prontos</span><b class="green">${r.ready}</b></div><div class="stat"><span>Sucata</span><b class="red">${r.scrap}</b></div></div><article class="card"><h3>Receber pneus retirados</h3><p class="sub">Simula pneus removidos durante os serviços da borracharia.</p><div class="row"><button class="btn ghost" onclick="addOldTire('worn')">+ Pneu careca</button><button class="btn ghost" onclick="addOldTire('punctured')">+ Pneu furado</button></div></article><article class="card"><h3>Processar reformas</h3><div class="row"><button class="btn yellow" onclick="reformTires('worn')">Reformar carecas · R$ 140 cada</button><button class="btn blue" onclick="reformTires('punctured')">Consertar furados · R$ 55 cada</button></div></article><button class="btn" onclick="returnTires()">Enviar ${r.ready} pneu(s) pronto(s) ao estoque</button>`}
function addOldTire(t){S.tireReform[t]++;save();render()}
function reformTires(t){let q=S.tireReform[t],unit=t==='worn'?140:55;if(!q)return toast('Não há pneus deste tipo');let cost=q*unit;if(S.cash<cost)return toast('Saldo insuficiente');let scrap=Math.floor(q*.15),ready=q-scrap;S.cash-=cost;S.expenses+=cost;S.tireReform[t]=0;S.tireReform.ready+=ready;S.tireReform.scrap+=scrap;S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:`Reforma de ${q} pneu(s)`,value:-cost});save();render();toast(ready+' recuperado(s), '+scrap+' sucateado(s)')}
function returnTires(){let q=S.tireReform.ready;if(!q)return toast('Nenhum pneu pronto');S.stock['Pneu aro 15']=(S.stock['Pneu aro 15']||0)+q;S.tireReform.ready=0;save();render();toast(q+' pneus retornaram ao estoque')}
function usedcars(){return `<section class="hero"><h1>Compra, restauração e revenda</h1><p>Compre veículos usados, restaure e venda com lucro.</p></section><button class="btn blue" onclick="buyUsedCar()">Encontrar veículo usado</button><div class="sectionHead"><h2>Meus projetos</h2></div>${S.usedCars.map(c=>`<article class="card"><div class="row between"><div><h3>🚘 ${c.name}</h3><div class="sub">Compra ${money(c.buy)} · condição ${c.condition}%</div></div><span class="tag ${c.ready?'ok':'wait'}">${c.ready?'Restaurado':'A restaurar'}</span></div><div class="row" style="margin-top:12px">${c.ready?`<button class="btn" onclick="sellUsedCar(${c.id})">Vender por ${money(c.sell)}</button>`:`<button class="btn yellow" onclick="restoreUsedCar(${c.id})">Restaurar · ${money(c.repair)}</button>`}</div></article>`).join('')||'<div class="empty">Nenhum projeto de restauração.</div>'}`}
function buyUsedCar(){let name=cars[Math.floor(Math.random()*cars.length)],buy=18000+Math.floor(Math.random()*32000),condition=20+Math.floor(Math.random()*35);if(S.cash<buy)return toast('Saldo insuficiente');S.cash-=buy;S.usedCars.push({id:Date.now(),name,buy,condition,repair:Math.round(buy*(.25+Math.random()*.2)),sell:Math.round(buy*1.75),ready:false});S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Compra de usado · '+name,value:-buy});save();render()}
function restoreUsedCar(id){let c=S.usedCars.find(x=>x.id===id);if(S.cash<c.repair)return toast('Saldo insuficiente');S.cash-=c.repair;S.expenses+=c.repair;c.ready=true;c.condition=100;S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Restauração · '+c.name,value:-c.repair});save();render();toast('Restauração concluída')}
function sellUsedCar(id){let c=S.usedCars.find(x=>x.id===id);S.cash+=c.sell;S.revenue+=c.sell;S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Receita',desc:'Revenda · '+c.name,value:c.sell});S.usedCars=S.usedCars.filter(x=>x.id!==id);save();render();toast('Veículo vendido')}
function historyPage(){return `<section class="hero"><h1>Clientes, avaliações e garantias</h1><p>${S.history.length} serviços entregues · garantia padrão de 30 dias.</p></section>${S.history.map(h=>`<article class="card"><div class="row between"><div><h3>🚗 ${h.vehicle}</h3><div class="sub">${h.client} · entregue em ${h.delivered}</div></div><b class="yellow">★ ${h.rating}</b></div><p class="sub">${h.selected.map(id=>services.find(s=>s.id===id)?.name).filter(Boolean).join(' • ')}</p><span class="tag ok">Garantia ${h.warranty} dias</span></article>`).join('')||'<div class="empty">As avaliações aparecerão após as entregas.</div>'}`}
function bank(){let b=S.bank;return `<section class="hero"><h1>Banco da oficina</h1><p>Capital, investimentos e crédito empresarial.</p></section><div class="grid"><div class="stat"><span>Conta da oficina</span><b class="green">${money(S.cash)}</b></div><div class="stat"><span>Investido</span><b class="blue">${money(b.investment)}</b></div><div class="stat"><span>Dívida</span><b class="red">${money(b.loanBalance)}</b></div><div class="stat"><span>Parcelas restantes</span><b>${b.installments}</b></div></div><article class="card"><h3>📈 Investimentos</h3><p class="sub">Rendimento de 0,8% a cada virada de mês.</p><div class="row"><button class="btn blue" onclick="investMoney()">Investir</button><button class="btn ghost" onclick="withdrawInvestment()">Resgatar</button></div></article><article class="card"><h3>💰 Empréstimos</h3><p class="sub">Crédito em 12 parcelas, com juros totais de 18%.</p><div class="row"><button class="btn yellow" onclick="takeLoan(100000)">R$ 100 mil</button><button class="btn yellow" onclick="takeLoan(500000)">R$ 500 mil</button><button class="btn yellow" onclick="takeLoan(1000000)">R$ 1 milhão</button></div></article><article class="card"><h3>🏦 Quitação</h3><p class="sub">Saldo devedor atual: ${money(b.loanBalance)}</p><button class="btn red" onclick="payLoan()">Quitar empréstimo</button></article>`}
function askValue(label,max){let v=Number(prompt(label,'100000'));return Number.isFinite(v)&&v>0?Math.min(Math.round(v),max):0}
function investMoney(){let v=askValue('Quanto deseja investir?',S.cash);if(!v)return;S.cash-=v;S.bank.investment+=v;save();render();toast('Investimento realizado')}
function withdrawInvestment(){let v=askValue('Quanto deseja resgatar?',S.bank.investment);if(!v)return;S.bank.investment-=v;S.cash+=v;save();render();toast('Valor resgatado')}
function takeLoan(v){if(S.bank.loanBalance>0)return toast('Quite o empréstimo atual primeiro');let total=Math.round(v*1.18);S.cash+=v;S.bank.loanBalance=total;S.bank.installments=12;S.bank.payment=Math.ceil(total/12);S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Entrada',desc:'Empréstimo bancário',value:v});save();render();toast('Crédito liberado')}
function payLoan(){let v=S.bank.loanBalance;if(!v)return toast('Nenhum empréstimo ativo');if(S.cash<v)return toast('Saldo insuficiente');S.cash-=v;S.expenses+=v;S.bank.loanBalance=0;S.bank.installments=0;S.bank.payment=0;S.ledger.unshift({day:S.day,month:S.month,year:S.year,type:'Despesa',desc:'Quitação de empréstimo',value:-v});save();render();toast('Empréstimo quitado')}
function catalog(){return `<section class="hero"><h1>Tabela de serviços</h1><p>Preços, duração e especialidade.</p></section>${services.map(s=>`<article class="card"><div class="row between"><div><h3>${s.name}</h3><div class="sub">${s.sector} · ${s.time}h de serviço</div></div><b class="green">${money(s.price)}</b></div></article>`).join('')}`}
function settings(){return `<section class="hero"><h1>Salvar e configurações</h1><p>O progresso é salvo neste navegador.</p></section><article class="card"><h3>Salvamento automático</h3><p class="sub">Cada ação importante é salva imediatamente no celular.</p><button class="btn" onclick="save();toast('Jogo salvo com sucesso')">Salvar agora</button></article><article class="card"><h3>Exportar segurança</h3><p class="sub">Baixe uma cópia do progresso para restaurar depois.</p><button class="btn blue" onclick="backup()">Baixar backup</button></article><article class="card"><h3>Recomeçar</h3><p class="sub">Apaga definitivamente o progresso deste navegador.</p><button class="btn red" onclick="resetGame()">Apagar progresso</button></article>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='auto-center-backup.json';a.click();URL.revokeObjectURL(a.href)}function resetGame(){if(confirm('Apagar todo o progresso?')){S=fresh();save();go('home')}}
function render(){header();nav();let fn={home,orders,team,stock,finance,sectors,equipment:equipmentPage,suppliers,reformer,usedcars,history:historyPage,bank,catalog,settings}[page]||home;document.getElementById('view').innerHTML=fn();window.scrollTo({top:0,behavior:'instant'})}
function offline(){let minutes=Math.floor((Date.now()-(S.lastSeen||Date.now()))/60000);let sim=Math.min(minutes,48);if(sim>0){for(let i=0;i<sim;i++)tickHour();toast('Enquanto você esteve fora, o jogo avançou '+sim+' hora(s).')}S.lastSeen=Date.now();save()}
function advanceAuto(){let y=window.scrollY;tickHour();save();render();window.scrollTo(0,y)}
offline();render();setInterval(advanceAuto,60000);setInterval(()=>save(),30000);
</script></body></html>
