<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#63b847"><title>Fazenda dos Sonhos</title><style>
:root{--g:#4ca63d;--gd:#2d752e;--cream:#fff8d9;--soil:#9b6238;--blue:#59bce8;--yellow:#ffd45b;--red:#e85f56;--ink:#26351e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#8ddcf3 0 190px,#8ed45b 190px);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:10;background:#fff9dfed;border-bottom:3px solid #e7c55d;padding:10px 12px;display:flex;align-items:center;gap:9px;box-shadow:0 3px 12px #31551d33}.logo{width:48px;height:48px;border-radius:50%;background:#75c94f;display:grid;place-items:center;font-size:29px;border:3px solid #fff}.brand{flex:1}.brand b{display:block;font-size:20px;color:#2e6c2c}.brand small{color:#6d7f58}.currency{text-align:right;font-weight:800}.currency span{display:block;color:#c47e13}.currency small{color:#3a9a56}.menu{border:0;border-radius:13px;background:var(--g);color:#fff;font-size:22px;width:44px;height:44px}.content{padding:15px 12px}.hero{background:linear-gradient(135deg,#fff9dd,#fff2b8);border:2px solid #e4c766;border-radius:20px;padding:15px;box-shadow:0 5px 0 #b48a3b;margin-bottom:14px}.hero h1{margin:0;font-size:26px}.sub{color:#6e7a59;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fffbe9;border:2px solid #e6ca77;border-radius:18px;padding:13px;margin-bottom:10px;box-shadow:0 4px 0 #b98b43}.card h3{margin:0 0 5px}.stat b{display:block;font-size:21px;color:var(--gd);margin-top:4px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:12px;padding:9px 12px;background:var(--g);color:white;font-weight:800;box-shadow:0 3px 0 #286625}.btn.yellow{background:#e5a72f;box-shadow:0 3px 0 #9a6816}.btn.blue{background:#3ca8db;box-shadow:0 3px 0 #24729c}.btn.red{background:#df6258;box-shadow:0 3px 0 #9d342d}.btn.ghost{background:#fff4c8;color:#5b653f;border:1px solid #d3b85d;box-shadow:none}.btn:disabled{opacity:.45}.section{display:flex;justify-content:space-between;align-items:center;margin:21px 3px 9px}.section h2{margin:0;font-size:20px}.badge{background:#e6f6d5;border:1px solid #9dc57d;border-radius:20px;padding:5px 9px;font-size:12px}.plots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.plot{aspect-ratio:1;border:2px solid #704528;border-radius:10px;background:repeating-linear-gradient(25deg,#9c653c,#9c653c 9px,#a97145 9px,#a97145 18px);color:#fff;display:grid;place-items:center;text-align:center;padding:2px;font-size:11px;font-weight:800;box-shadow:0 3px 0 #5f3a22}.plot.ready{background:#e6b444;border-color:#a87320}.plot.empty{font-size:21px}.progress{height:9px;background:#ddcf9b;border-radius:8px;overflow:hidden;margin:8px 0}.progress i{height:100%;display:block;background:linear-gradient(90deg,#58bd42,#a8df57)}.chips{display:flex;gap:7px;overflow:auto;padding:4px 0}.chip{white-space:nowrap;border:1px solid #b9a459;background:#fff7cf;color:#535f3b;border-radius:20px;padding:8px 11px}.chip.on{background:#5eaf43;color:white}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff9eafa;border-top:2px solid #d7ba5c;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:#667359;font-size:11px;padding:4px 1px}.nav i{display:block;font-style:normal;font-size:23px}.nav .on{color:#31843a;font-weight:800}.drawer{display:none;position:fixed;inset:0;background:#17320daa;z-index:30}.drawer.on{display:block}.sheet{margin-left:auto;width:min(86%,410px);height:100%;overflow:auto;background:#fff9df;padding:17px}.menuItem{display:block;width:100%;padding:13px;margin:7px 0;border:1px solid #d5bd68;border-radius:13px;background:#fff3bd;text-align:left;color:#314325;font-weight:750}.toast{display:none;position:fixed;z-index:60;left:50%;bottom:88px;transform:translateX(-50%);background:#2b682c;color:#fff;padding:12px 16px;border-radius:13px;max-width:90%;text-align:center}.toast.on{display:block}.field{width:100%;border:2px solid #d4bd70;background:#fffdf1;border-radius:11px;padding:10px}.empty{text-align:center;padding:28px;color:#758064}@media(max-width:370px){.plots{grid-template-columns:repeat(4,1fr)}.brand b{font-size:17px}.currency{font-size:12px}}
</style></head><body><div class="app"><header class="top"><div class="logo">🌻</div><div class="brand" onclick="openLevel()" title="Ver próximos níveis" style="cursor:pointer"><b>FAZENDA DOS SONHOS</b><small id="levelText"></small></div><div class="currency" id="currency"></div><button class="menu" onclick="toggleMenu()">☰</button></header><main class="content" id="view"></main></div><nav class="nav"><div class="navin" id="nav"></div></nav><div class="drawer" id="drawer" onclick="if(event.target===this)toggleMenu()"><aside class="sheet"><div class="row between"><div><h2 style="margin:0">Minha Fazenda</h2><div class="sub">Gestão e produção</div></div><button class="btn red" onclick="toggleMenu()">✕</button></div><div id="menuList"></div></aside></div><div class="toast" id="toast"></div><script>
'use strict';const KEY='fazenda_dos_sonhos_v1';
const crops={trigo:{name:'Trigo',icon:'🌾',time:20,buy:1,sell:3,xp:2,level:1},milho:{name:'Milho',icon:'🌽',time:45,buy:2,sell:7,xp:4,level:2},cenoura:{name:'Cenoura',icon:'🥕',time:90,buy:3,sell:11,xp:6,level:3},cana:{name:'Cana-de-açúcar',icon:'🎋',time:180,buy:5,sell:18,xp:9,level:5},soja:{name:'Soja',icon:'🫘',time:300,buy:8,sell:28,xp:13,level:7}};
const products={pao:{name:'Pão',icon:'🍞',time:60,value:35,xp:12,level:2,needs:{trigo:3}},racao:{name:'Ração',icon:'🥣',time:80,value:42,xp:14,level:3,needs:{trigo:2,milho:2}},pipoca:{name:'Pipoca',icon:'🍿',time:90,value:55,xp:16,level:4,needs:{milho:3}},creme:{name:'Creme',icon:'🥛',time:120,value:75,xp:20,level:5,needs:{leite:2}},acucar:{name:'Açúcar',icon:'🧂',time:150,value:90,xp:24,level:6,needs:{cana:3}},queijo:{name:'Queijo',icon:'🧀',time:210,value:145,xp:32,level:7,needs:{leite:3}},bolo:{name:'Bolo de cenoura',icon:'🍰',time:240,value:180,xp:40,level:8,needs:{trigo:2,cenoura:3,ovo:2}},torta:{name:'Torta de maçã',icon:'🥧',time:300,value:260,xp:55,level:10,needs:{trigo:2,ovo:2,maca:3}},suco:{name:'Suco de laranja',icon:'🧃',time:240,value:220,xp:45,level:11,needs:{laranja:4}}};
function fresh(){return{coins:100000000,diamonds:10000000,wealthV2:true,level:1,xp:0,xpNeed:100,barnCap:80,siloCap:80,plots:Array.from({length:12},(_,i)=>({id:i,crop:null,end:0})),inv:{trigo:10,milho:5,cenoura:0,cana:0,soja:0,ovo:0,leite:0,pao:0,racao:0,pipoca:0,creme:0,acucar:0,queijo:0,bolo:0,torta:0,suco:0,maca:0,laranja:0,cereja:0},animals:{chicken:2,cow:1},animalReady:{chicken:Date.now()+60000,cow:Date.now()+120000},machines:{padaria:{name:'Padaria',icon:'🥖',level:1,queue:[],cap:3},racao:{name:'Moinho de ração',icon:'⚙️',level:1,queue:[],cap:3},pipoqueira:{name:'Pipoqueira',icon:'🍿',level:1,queue:[],cap:3},laticinio:{name:'Laticínio',icon:'🧀',level:1,queue:[],cap:3},acucareiro:{name:'Engenho',icon:'🏭',level:1,queue:[],cap:3},sucos:{name:'Fábrica de sucos',icon:'🧃',level:1,queue:[],cap:3}},trees:[],equipment:{tractor:0,sprinkler:0},orders:[],shop:[],completed:0,lastSeen:Date.now(),version:2};}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}if(!S.wealthV2){S.coins=100000000;S.diamonds=10000000;S.wealthV2=true}S.trees=S.trees||[];S.equipment=S.equipment||{tractor:0,sprinkler:0};S.machines.racao=S.machines.racao||{name:'Moinho de ração',icon:'⚙️',level:1,queue:[],cap:3};S.machines.pipoqueira=S.machines.pipoqueira||{name:'Pipoqueira',icon:'🍿',level:1,queue:[],cap:3};S.machines.sucos=S.machines.sucos||{name:'Fábrica de sucos',icon:'🧃',level:1,queue:[],cap:3};Object.values(S.machines).forEach(m=>m.cap=m.cap||3);['pipoca','queijo','torta','suco','maca','laranja','cereja'].forEach(k=>S.inv[k]=S.inv[k]||0);let page='farm',seed='trigo';
function money(n){return Number(n||0).toLocaleString('pt-BR')}function invCount(){return Object.values(S.inv).reduce((a,b)=>a+b,0)}function cropCount(){return Object.entries(S.inv).filter(([k])=>crops[k]).reduce((n,[,v])=>n+v,0)}function save(){S.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(S));header()}function header(){document.getElementById('currency').innerHTML=`<span>🪙 ${money(S.coins)}</span><small>💎 ${money(S.diamonds)}</small>`;document.getElementById('levelText').textContent=`Nível ${S.level} · ${S.xp}/${S.xpNeed} XP · toque para ver`}
const levelUnlocks={2:'Milho, Padaria e Pão',3:'Cenoura, Moinho de ração e Ração',4:'Pipoqueira, Pipoca e Macieira',5:'Cana-de-açúcar, Laticínio e Trator',6:'Engenho, Açúcar e Laranjeira',7:'Soja, Queijo e Aspersor',8:'Bolo de cenoura',9:'Cerejeira',10:'Torta de maçã',11:'Fábrica e Suco de laranja'};function openLevel(){let rows=[];for(let n=S.level+1;n<=Math.min(11,S.level+4);n++)rows.push(`Nível ${n}: ${levelUnlocks[n]||'novas recompensas'}`);alert(`Nível ${S.level}\nXP: ${S.xp}/${S.xpNeed}\n\nPróximos desbloqueios:\n${rows.join('\n')||'Você liberou todo o conteúdo atual!'}`)}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}function addXP(x){S.xp+=x;while(S.xp>=S.xpNeed){S.xp-=S.xpNeed;S.level++;S.xpNeed=Math.round(S.xpNeed*1.35);S.coins+=S.level*250;toast('🎉 Nível '+S.level+' alcançado!')}}
const pages=[['farm','🌱','Fazenda'],['animals','🐔','Animais'],['production','🏭','Produção'],['orders','🚚','Pedidos'],['store','🛒','Loja']];function nav(){document.getElementById('nav').innerHTML=pages.map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('');document.getElementById('menuList').innerHTML=[...pages,['orchard','🌳','Pomar'],['equipment','🚜','Máquinas e equipamentos'],['inventory','📦','Celeiro e silo'],['market','🏪','Banca de vendas'],['expand','🗺️','Expansões'],['settings','⚙️','Salvar e configurações']].map(x=>`<button class="menuItem" onclick="go('${x[0]}');toggleMenu()">${x[1]} ${x[2]}</button>`).join('')}function go(p){page=p;render()}function toggleMenu(){document.getElementById('drawer').classList.toggle('on')}
function farm(){let now=Date.now();return `<section class="hero"><h1>🌻 Minha Fazenda</h1><div class="sub">Plante, colha e faça sua fazenda crescer.</div><div class="progress"><i style="width:${S.xp/S.xpNeed*100}%"></i></div></section><div class="row between"><div class="chips">${Object.entries(crops).filter(([,c])=>c.level<=S.level).map(([k,c])=>`<button class="chip ${seed===k?'on':''}" onclick="seed='${k}';render()">${c.icon} ${c.name}</button>`).join('')}</div><span class="badge">${S.plots.length} terrenos</span></div><div class="section"><h2>Plantação</h2><span class="badge">Toque para plantar ou colher</span></div><div class="plots">${S.plots.map(p=>{if(!p.crop)return `<button class="plot empty" onclick="plant(${p.id})">＋</button>`;let c=crops[p.crop],left=Math.max(0,Math.ceil((p.end-now)/1000)),ready=left<=0;return `<button class="plot ${ready?'ready':''}" onclick="${ready?`harvest(${p.id})`:''}"><div><div style="font-size:29px">${c.icon}</div>${ready?'COLHER':left+'s'}</div></button>`}).join('')}</div><div class="grid" style="margin-top:16px"><div class="card stat"><span class="sub">Silo</span><b>${cropCount()}/${S.siloCap}</b></div><div class="card stat"><span class="sub">Celeiro</span><b>${invCount()}/${S.barnCap}</b></div></div>`}
function plant(id){let c=crops[seed],p=S.plots[id];if(c.level>S.level)return;if((S.inv[seed]||0)<1)return toast('Faltam sementes de '+c.name);S.inv[seed]--;p.crop=seed;let bonus=Math.min(.5,(S.equipment.tractor+S.equipment.sprinkler)*.05);p.end=Date.now()+c.time*(1-bonus)*1000;save();render()}function harvest(id){let p=S.plots[id],c=crops[p.crop];if(Date.now()<p.end)return;if(invCount()+3>S.barnCap)return toast('Celeiro cheio');S.inv[p.crop]=(S.inv[p.crop]||0)+3;addXP(c.xp);p.crop=null;p.end=0;save();render()}
function animals(){let now=Date.now(),types=[['chicken','Galinhas','🐔','ovo','Ovos',60],['cow','Vacas','🐄','leite','Leite',120]];return `<section class="hero"><h1>🐾 Animais</h1><div class="sub">Cuide dos animais e recolha produtos.</div></section>${types.map(t=>{let left=Math.max(0,Math.ceil((S.animalReady[t[0]]-now)/1000)),ready=left<=0;return `<article class="card"><div class="row between"><div><h3>${t[2]} ${t[1]}</h3><div class="sub">${S.animals[t[0]]} animal(is) · produz ${t[4]}</div></div><b>${ready?'Pronto':left+'s'}</b></div><div class="row" style="margin-top:10px"><button class="btn" ${ready?'':'disabled'} onclick="collectAnimal('${t[0]}','${t[3]}',${t[5]})">Recolher</button><button class="btn yellow" onclick="buyAnimal('${t[0]}')">Comprar · 🪙 ${S.animals[t[0]]*300}</button></div></article>`}).join('')}`}
function collectAnimal(type,item,time){if(Date.now()<S.animalReady[type])return;let q=S.animals[type];if(invCount()+q>S.barnCap)return toast('Celeiro cheio');S.inv[item]=(S.inv[item]||0)+q;S.animalReady[type]=Date.now()+time*1000;addXP(q*3);save();render()}function buyAnimal(type){let cost=S.animals[type]*300;if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;S.animals[type]++;save();render()}
const machineLevels={padaria:2,racao:3,pipoqueira:4,laticinio:5,acucareiro:6,sucos:11};function machineFor(k){return{pao:'padaria',bolo:'padaria',torta:'padaria',racao:'racao',pipoca:'pipoqueira',creme:'laticinio',queijo:'laticinio',acucar:'acucareiro',suco:'sucos'}[k]}function production(){let now=Date.now(),open=Object.entries(S.machines).filter(([mk])=>S.level>=machineLevels[mk]);return `<section class="hero"><h1>🏭 Produção</h1><div class="sub">Transforme colheitas e aumente a fila de cada máquina.</div></section>${open.map(([mk,m])=>{let available=Object.entries(products).filter(([k,p])=>machineFor(k)===mk&&p.level<=S.level);let cost=m.cap*2500;return `<article class="card"><div class="row between"><h3>${m.icon} ${m.name}</h3><span class="badge">Fila ${m.queue.length}/${m.cap}</span></div>${m.queue.map((q,i)=>{let p=products[q.product],left=Math.max(0,Math.ceil((q.end-now)/1000));return `<div class="row between" style="padding:8px 0"><span>${p.icon} ${p.name}</span>${i===0&&left<=0?`<button class="btn" onclick="collectProduct('${mk}')">Recolher</button>`:`<span>${left}s</span>`}</div>`}).join('')||'<div class="sub">Máquina livre</div>'}<div class="chips" style="margin-top:10px">${available.map(([k,p])=>`<button class="chip" onclick="makeProduct('${mk}','${k}')">${p.icon} ${p.name}</button>`).join('')}</div><button class="btn yellow" style="margin-top:10px" onclick="upgradeQueue('${mk}')">Aumentar fila +1 · 🪙 ${money(cost)}</button></article>`}).join('')}`}
function makeProduct(mk,k){let m=S.machines[mk],p=products[k];if(m.queue.length>=m.cap)return toast('Fila cheia');for(let [i,q] of Object.entries(p.needs))if((S.inv[i]||0)<q)return toast('Falta: '+(products[i]?.name||crops[i]?.name||i));for(let [i,q] of Object.entries(p.needs))S.inv[i]-=q;let start=m.queue.length?m.queue[m.queue.length-1].end:Date.now();m.queue.push({product:k,end:start+p.time*1000});save();render()}function collectProduct(mk){let m=S.machines[mk],q=m.queue[0];if(!q||Date.now()<q.end)return;let p=products[q.product];if(invCount()+1>S.barnCap)return toast('Celeiro cheio');S.inv[q.product]=(S.inv[q.product]||0)+1;m.queue.shift();addXP(p.xp);save();render()}function upgradeQueue(mk){let m=S.machines[mk],cost=m.cap*2500;if(m.cap>=10)return toast('Fila no máximo');if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;m.cap++;save();render()}
function ensureOrders(){while(S.orders.length<6){let keys=[...Object.keys(crops),...Object.keys(products)].filter(k=>(crops[k]?.level||products[k]?.level)<=S.level),items={};for(let i=0;i<1+Math.floor(Math.random()*2);i++){let k=keys[Math.floor(Math.random()*keys.length)];items[k]=(items[k]||0)+1+Math.floor(Math.random()*3)}let value=Object.entries(items).reduce((n,[k,q])=>n+q*(crops[k]?.sell||products[k]?.value||10),0);S.orders.push({id:Date.now()+Math.random(),items,value:Math.round(value*1.4),xp:Math.max(5,Math.round(value/4))})}}
function orders(){ensureOrders();return `<section class="hero"><h1>🚚 Quadro de pedidos</h1><div class="sub">Veja o pedido e compare com seu estoque.</div></section>${S.orders.map(o=>`<article class="card"><div class="row between"><div><h3>Pedido da cidade</h3>${Object.entries(o.items).map(([k,q])=>`<div class="sub">${products[k]?.icon||crops[k]?.icon} ${products[k]?.name||crops[k]?.name}: precisa <b>${q}</b> · estoque <b style="color:${(S.inv[k]||0)>=q?'#31843a':'#d3483e'}">${S.inv[k]||0}</b></div>`).join('')}</div><div><b>🪙 ${o.value}</b><div class="sub">⭐ ${o.xp} XP</div></div></div><button class="btn" style="margin-top:10px" onclick="deliverOrder(${o.id})">Entregar pedido</button></article>`).join('')}`}
function deliverOrder(id){let o=S.orders.find(x=>x.id===id);for(let [k,q] of Object.entries(o.items))if((S.inv[k]||0)<q)return toast('Faltam produtos');for(let [k,q] of Object.entries(o.items))S.inv[k]-=q;S.coins+=o.value;addXP(o.xp);S.completed++;S.orders=S.orders.filter(x=>x.id!==id);save();render();toast('Pedido entregue!')}
function store(){return `<section class="hero"><h1>🛒 Loja da fazenda</h1><div class="sub">Compre sementes e recursos.</div></section>${Object.entries(crops).filter(([,c])=>c.level<=S.level).map(([k,c])=>`<article class="card"><div class="row between"><div><h3>${c.icon} ${c.name}</h3><div class="sub">No estoque: ${S.inv[k]||0}</div></div><div><input id="buy${k}" class="field" style="width:75px" type="number" min="1" value="5"><button class="btn yellow" onclick="buySeeds('${k}')">Comprar</button></div></div></article>`).join('')}`}
function buySeeds(k){let q=Math.max(1,Math.floor(Number(document.getElementById('buy'+k).value)||1)),cost=q*crops[k].buy;if(S.coins<cost)return toast('Moedas insuficientes');if(invCount()+q>S.barnCap)return toast('Armazém cheio');S.coins-=cost;S.inv[k]=(S.inv[k]||0)+q;save();render()}
function inventory(){return `<section class="hero"><h1>📦 Celeiro e silo</h1><div class="sub">Capacidade total ${invCount()}/${S.barnCap}</div></section>${Object.entries(S.inv).filter(([,q])=>q>0).map(([k,q])=>`<article class="card"><div class="row between"><h3>${products[k]?.icon||crops[k]?.icon||'📦'} ${products[k]?.name||crops[k]?.name||k}</h3><b>${q}</b></div></article>`).join('')}<button class="btn yellow" onclick="upgradeStorage()">Aumentar capacidade +25 · 🪙 ${S.barnCap*20}</button>`}function upgradeStorage(){let c=S.barnCap*20;if(S.coins<c)return toast('Moedas insuficientes');S.coins-=c;S.barnCap+=25;S.siloCap+=25;save();render()}
function market(){return `<section class="hero"><h1>🏪 Banca de vendas</h1><div class="sub">Venda produtos diretamente aos visitantes.</div></section>${Object.entries(S.inv).filter(([,q])=>q>0).map(([k,q],i)=>`<article class="card"><div class="row between"><div><h3>${products[k]?.icon||crops[k]?.icon} ${products[k]?.name||crops[k]?.name}</h3><div class="sub">Disponível ${q} · valor ${crops[k]?.sell||products[k]?.value}</div></div><div><input id="sell${i}" class="field" style="width:70px" type="number" min="1" value="1"><button class="btn" onclick="sellItem('${k}',${i})">Vender</button></div></div></article>`).join('')||'<div class="empty">Sem produtos para vender.</div>'}`}
function sellItem(k,i){let q=Math.max(1,Math.floor(Number(document.getElementById('sell'+i).value)||1));if(S.inv[k]<q)return toast('Quantidade indisponível');let value=(crops[k]?.sell||products[k]?.value||1)*q;S.inv[k]-=q;S.coins+=value;save();render()}
function expand(){let cost=S.plots.length*150;return `<section class="hero"><h1>🗺️ Expansões</h1><div class="sub">Abra novos espaços na sua fazenda.</div></section><article class="card"><div class="row between"><div><h3>🌱 Novo terreno</h3><div class="sub">+3 espaços para plantio</div></div><button class="btn yellow" onclick="expandPlots()">🪙 ${cost}</button></div></article>`}function expandPlots(){let cost=S.plots.length*150;if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;let n=S.plots.length;for(let i=0;i<3;i++)S.plots.push({id:n+i,crop:null,end:0});save();render()}
const treeTypes={maca:{name:'Macieira',fruit:'Maçã',icon:'🍎',level:4,cost:500,time:180},laranja:{name:'Laranjeira',fruit:'Laranja',icon:'🍊',level:6,cost:800,time:300},cereja:{name:'Cerejeira',fruit:'Cereja',icon:'🍒',level:9,cost:1200,time:420}};function orchard(){let now=Date.now(),shop=Object.entries(treeTypes).map(([k,t])=>`<article class="card"><div class="row between"><div><h3>${t.icon} ${t.name}</h3><div class="sub">Nível ${t.level} · rende 3 frutas por colheita</div></div><button class="btn yellow" ${S.level<t.level?'disabled':''} onclick="buyTree('${k}')">🪙 ${money(t.cost)}</button></div></article>`).join('');let trees=S.trees.map(t=>{let x=treeTypes[t.type],left=Math.max(0,Math.ceil((t.end-now)/1000)),dead=t.harvests>=3;return `<article class="card"><div class="row between"><div><h3>${x.icon} ${x.name}</h3><div class="sub">Colheitas ${t.harvests}/3</div></div>${dead?`<button class="btn red" onclick="removeTree(${t.id})">Cortar</button>`:left<=0?`<button class="btn" onclick="harvestTree(${t.id})">Colher 3</button>`:`<b>${left}s</b>`}</div></article>`}).join('');return `<section class="hero"><h1>🌳 Pomar</h1><div class="sub">Cada árvore dá 3 colheitas de 3 frutas.</div></section><div class="section"><h2>Minhas árvores</h2><span class="badge">${S.trees.length}</span></div>${trees||'<div class="empty">Compre sua primeira árvore.</div>'}<div class="section"><h2>Viveiro</h2></div>${shop}`}
function buyTree(k){let t=treeTypes[k];if(S.level<t.level)return toast('Libera no nível '+t.level);if(S.coins<t.cost)return toast('Moedas insuficientes');S.coins-=t.cost;S.trees.push({id:Date.now()+Math.random(),type:k,end:Date.now()+t.time*1000,harvests:0});save();render()}function harvestTree(id){let t=S.trees.find(x=>x.id===id);if(!t||Date.now()<t.end||t.harvests>=3)return;let x=treeTypes[t.type];if(invCount()+3>S.barnCap)return toast('Celeiro cheio');S.inv[t.type]=(S.inv[t.type]||0)+3;t.harvests++;t.end=Date.now()+x.time*1000;addXP(10);save();render()}function removeTree(id){S.trees=S.trees.filter(x=>x.id!==id);save();render()}
function equipment(){let list=[['tractor','🚜','Trator',5],['sprinkler','💦','Aspersor',7]];return `<section class="hero"><h1>🚜 Máquinas e equipamentos</h1><div class="sub">Cada melhoria reduz 5% do tempo da plantação, até 50% no total.</div></section>${list.map(([k,icon,name,level])=>{let lv=S.equipment[k],cost=(lv+1)*50000;return `<article class="card"><div class="row between"><div><h3>${icon} ${name}</h3><div class="sub">Nível ${lv}/5 · desbloqueia no nível ${level}</div></div><button class="btn yellow" ${S.level<level||lv>=5?'disabled':''} onclick="upgradeEquipment('${k}',${level})">Melhorar · 🪙 ${money(cost)}</button></div></article>`}).join('')}`}
function upgradeEquipment(k,level){let lv=S.equipment[k];if(S.level<level)return toast('Ainda não desbloqueado');if(lv>=5)return toast('Nível máximo');let cost=(lv+1)*50000;if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;S.equipment[k]++;save();render()}
function settings(){return `<section class="hero"><h1>⚙️ Configurações</h1><div class="sub">O jogo salva automaticamente neste navegador.</div></section><article class="card"><h3>Salvar progresso</h3><button class="btn" onclick="save();toast('Jogo salvo')">Salvar agora</button></article><article class="card"><h3>Recomeçar</h3><button class="btn red" onclick="if(confirm('Apagar todo o progresso?')){S=fresh();save();go('farm')}">Apagar progresso</button></article>`}
function render(){header();nav();let fn={farm,animals,production,orders,store,orchard,equipment,inventory,market,expand,settings}[page]||farm;document.getElementById('view').innerHTML=fn();window.scrollTo(0,0)}function offline(){let mins=Math.min(480,Math.floor((Date.now()-(S.lastSeen||Date.now()))/60000));if(mins>0)toast('🌙 Você ficou '+mins+' minuto(s) fora. As produções continuaram!');save()}offline();render();setInterval(()=>{save();if(['farm','animals','production','orchard'].includes(page)){let y=scrollY;render();scrollTo(0,y)}else header()},1000);
</script></body></html>
