<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Parque dos Dinossauros do Lucca</title><style>body{margin:0;background:#10251e;color:white;font:16px system-ui}#hud{position:absolute;top:12px;left:12px;background:#10251edc;padding:14px;border-radius:14px;max-width:85vw}button{background:#e6b943;border:0;border-radius:9px;padding:10px;margin:3px;font-weight:bold}#msg{font-size:13px}canvas{display:block}#cover{position:fixed;inset:0;z-index:10;background:linear-gradient(0deg,#061b16ed,transparent 65%),url('capa.png') center/cover;display:grid;place-items:end center;text-align:center}.covercontent{padding:22px 15px 9vh;text-shadow:0 3px 10px #000}.covercontent h1{font-size:clamp(27px,7vw,55px);margin:0}.covercontent p{font-weight:bold}#play{font-size:24px;padding:16px 42px;background:#ffc33c}#hud{z-index:3;max-width:calc(100vw - 35px);font-size:14px}#shop{position:fixed;z-index:5;right:10px;top:10px;bottom:10px;width:min(370px,calc(100vw - 20px));background:#10251ef5;border:2px solid #c8a84c;border-radius:16px;padding:12px;overflow:auto;box-sizing:border-box}.shophead{display:flex;justify-content:space-between;align-items:center}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #ffffff33;padding:8px 0}.item button{font-size:12px;white-space:nowrap}button{cursor:pointer}#gift{background:#9bdab3}#msg{max-width:280px}[hidden]{display:none!important}</style><div id="cover"><div class="covercontent"><h1>🦖 PARQUE DO LUCCA</h1><p>A aventura dos dinossauros começa aqui!</p><button id="play">▶ JOGAR</button></div></div><div id="hud"><b>🦖 Parque do Lucca</b><div id="cash">💰 R$ 100.000</div><button id="shopbtn">🛒 LOJA DE DINOS</button><button id="gift">🎁 BÔNUS + R$ 50.000</button><div id="msg">Arraste para girar a câmera. Dois dedos para aproximar.</div></div><div id="shop" hidden><div class="shophead"><b>🦕 Loja de Dinossauros</b><button id="close">✕</button></div><div id="items"></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd9e9);scene.fog=new THREE.Fog(0x9bd9e9,75,170);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);camera.position.set(22,26,35);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x45653a,2));const sun=new THREE.DirectionalLight(0xfff5db,2.2);sun.position.set(25,40,10);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshStandardMaterial({color:0x448a4a}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const wood=mat(0x8c6b46),leaf=mat(0x246e37);function cylinder(r1,r2,h,m,x,y,z){let o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,8),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}for(let i=0;i<85;i++){let x=(Math.random()-.5)*105,z=(Math.random()-.5)*105;if(Math.abs(x)<23&&Math.abs(z)<23)continue;let h=2+Math.random()*3;cylinder(.35,.48,h,wood,x,h/2,z);let crown=new THREE.Mesh(new THREE.ConeGeometry(1.5+Math.random(),4,7),leaf);crown.position.set(x,h+1.7,z);scene.add(crown)}const fence=mat(0x8c9695);for(let v=-22;v<=22;v+=4){for(let z of [-22,22])cylinder(.17,.17,3,fence,v,1.5,z);for(let x of [-22,22])cylinder(.17,.17,3,fence,x,1.5,v)}function rail(x,y,z,sx,sz){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,.13,sz),fence);o.position.set(x,y,z);scene.add(o)}for(let y of [1,2.4]){for(let z of [-22,22])rail(0,y,z,44,.12);for(let x of [-22,22])rail(x,y,0,.12,44)}let animals=[],cash=100000;const catalog=[['Tricerátops',12000,0x9a805d],['T-Rex',45000,0x66814c],['Braquiossauro',26000,0x8c9671],['Velociraptor',16000,0x5c8658],['Espinossauro',48000,0x587e8c],['Estegossauro',18000,0x829358],['Anquilossauro',19000,0x767e64],['Pteranodon',21000,0x937c65],['Diplodoco',27000,0x759775],['Carnotauro',31000,0x9b5145],['Paquicefalossauro',14000,0x9b8a58],['Parassaurolofo',17000,0x698a7a],['Ultimate',95000,0x332c39]];const colors=Object.fromEntries(catalog.map(d=>[d[0],d[2]]));const saved=JSON.parse(localStorage.getItem('luccaParkSave')||'null');if(saved&&Number.isFinite(saved.cash)){cash=saved.cash;document.getElementById('cash').textContent='💰 R$ '+cash.toLocaleString('pt-BR')}const items=document.getElementById('items');for(const [name,price] of catalog){const item=document.createElement('div');item.className='item';const label=document.createElement('span');label.textContent=(name==='Ultimate'?'👑 ':'🦖 ')+name;const btn=document.createElement('button');btn.textContent='R$ '+price.toLocaleString('pt-BR');btn.onclick=()=>buy(name,price);item.append(label,btn);items.append(item)}document.getElementById('play').onclick=()=>document.getElementById('cover').remove();document.getElementById('shopbtn').onclick=()=>document.getElementById('shop').hidden=false;document.getElementById('close').onclick=()=>document.getElementById('shop').hidden=true;document.getElementById('gift').onclick=()=>{cash+=50000;updateCash();save()};function updateCash(){document.getElementById('cash').textContent='💰 R$ '+cash.toLocaleString('pt-BR')}function save(){localStorage.setItem('luccaParkSave',JSON.stringify({cash,names:animals.map(a=>a.name)}))}window.buy=(name,price,restore=false)=>{if(!restore&&cash<price){document.getElementById('msg').textContent='Dinheiro insuficiente!';return}if(!restore)cash-=price;updateCash();let g=new THREE.Group(),m=mat(colors[name]);let body=new THREE.Mesh(new THREE.SphereGeometry(name==='Braquiossauro'?2.1:1.55,14,10),m);body.scale.set(1.6,.75,.75);body.position.y=2.2;g.add(body);for(let x of [-1.5,1.5])for(let z of [-.7,.7]){let leg=new THREE.Mesh(new THREE.CylinderGeometry(.27,.35,2,8),m);leg.position.set(x,1,z);g.add(leg)}let neck=new THREE.Mesh(new THREE.CylinderGeometry(.45,.7,name==='Braquiossauro'?5:1.7,10),m);neck.position.set(1.9,name==='Braquiossauro'?4.5:2.8,0);neck.rotation.z=name==='Braquiossauro'?-.12:-.8;g.add(neck);let head=new THREE.Mesh(new THREE.SphereGeometry(name==='T-Rex'?.85:.7,12,8),m);head.position.set(name==='Braquiossauro'?2.4:2.9,name==='Braquiossauro'?7:3.1,0);g.add(head);let tail=new THREE.Mesh(new THREE.ConeGeometry(.65,3.8,10),m);tail.rotation.z=Math.PI/2;tail.position.set(-3,2.1,0);g.add(tail);g.position.set((Math.random()-.5)*26,0,(Math.random()-.5)*26);scene.add(g);animals.push({g,name,phase:Math.random()*6,speed:.1+Math.random()*.2});if(name==='Ultimate'){for(const zz of [-.7,.7]){let wing=new THREE.Mesh(new THREE.ConeGeometry(2.4,5,3),mat(0x503d58));wing.rotation.x=zz>0?1.15:-1.15;wing.rotation.z=Math.PI/2;wing.position.set(0,3.4,zz*2.4);g.add(wing)}for(let zz of [-.5,0,.5]){let horn=new THREE.Mesh(new THREE.ConeGeometry(.22,1.6,7),mat(0xe2d9b8));horn.rotation.z=-Math.PI/2;horn.position.set(3.45,3.35,zz);g.add(horn)}}if(!restore)save();document.getElementById('msg').textContent='Você comprou um '+name+'! Total: '+animals.length+' dinossauro(s).'};if(saved&&Array.isArray(saved.names))for(const name of saved.names){const d=catalog.find(x=>x[0]===name);if(d)buy(name,d[1],true)}let dragging=false,lastX=0,lastY=0,az=.6,el=.6,dist=47;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;az-=(e.clientX-lastX)*.007;el=Math.max(.2,Math.min(1.4,el+(e.clientY-lastY)*.005));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(16,Math.min(90,dist+e.deltaY*.03))});let lastPinch=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(lastPinch)dist=Math.max(16,Math.min(90,dist+(lastPinch-d)*.1));lastPinch=d}},{passive:true});renderer.domElement.addEventListener('touchend',()=>lastPinch=0);function loop(t){requestAnimationFrame(loop);camera.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,0,0);for(let a of animals){a.g.rotation.y=Math.sin(t*.0002*a.speed+a.phase)*.7;a.g.position.x+=Math.sin(t*.0003+a.phase)*.002;a.g.position.z+=Math.cos(t*.0002+a.phase)*.002}renderer.render(scene,camera)}loop(0);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></html>
