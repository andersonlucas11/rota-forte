function farm(){let now=Date.now(),bp={chicken:{x:170,y:150},pig:{x:170,y:390},cow:{x:170,y:610},orders:{x:1190,y:160},barn:{x:1430,y:390},production:{x:1190,y:430},...(S.mapLayout.buildings||{})};let fields=S.plots.map((p,i)=>{let pos=S.mapLayout.fields[p.id]||(S.mapLayout.fields[p.id]={x:390+(i%12)*78,y:220+Math.floor(i/12)*78}),c=p.crop?crops[p.crop]:null,left=c?Math.max(0,Math.ceil((p.end-now)/1000)):0,ready=c&&left<=0;return `<button class="worldItem fieldTile ${ready?'ready':''}" data-field="${p.id}" style="left:${pos.x}px;top:${pos.y}px" onclick="fieldTap(${p.id})">${c?`<span><span class="cropIcon">${c.icon}</span>${ready?'COLHER':left+'s'}</span>`:'＋'}</button>`}).join('');
let building=(key,icon,name,action)=>`<button class="worldItem building" style="left:${bp[key].x}px;top:${bp[key].y}px" onclick="${action}">${farmArt(key)}<span class="buildingLabel">${name}</span></button>`;return `<div class="farmViewport" id="farmViewport"><div class="farmHud"><div class="hudBox"><div class="mapHint">🌱 Escolha a semente</div><div class="chips" id="worldSeedBar">${Object.entries(crops).filter(([,c])=>c.level<=S.level).map(([k,c])=>`<button class="chip ${seed===k?'on':''}" onclick="seed='${k}';keepRender()">${c.icon} ${S.seeds[k]||0}</button>`).join('')}</div></div><button class="btn ${editMap?'editOn':''}" onclick="toggleMapEdit()">${editMap?'✅ Concluir':'🖌️ Mover campos'}</button></div><div class="farmWorld" id="farmWorld" style="transform:translate(${S.mapCamera.x}px,${S.mapCamera.y}px) scale(${S.mapCamera.z})"><div class="road one"></div><div class="road two"></div><div class="pond"></div><div class="fence" style="left:330px;top:190px;width:1020px"></div><div class="scenery" style="left:55px;top:20px;width:120px">${farmArt('tree')}</div><div class="scenery" style="left:1530px;top:80px;width:120px">${farmArt('tree')}</div><div class="scenery" style="left:980px;top:890px;width:120px">${farmArt('tree')}</div>${building('chicken','🐔','Galinheiro',`openFarmPanel('chicken')`)}${building('pig','🐷','Chiqueiro',`openFarmPanel('pig')`)}${building('cow','🐄','Estábulo',`openFarmPanel('cow')`)}${building('orders','🚚','Clientes e pedidos',`openFarmPanel('orders')`)}${building('barn','🌾','Silo e celeiro',`go('inventory')`)}${building('production','🏭','Máquinas',`go('production')`)}${fields}</div><div class="zoomBox"><button class="btn" onclick="zoomMap(.1)">＋</button><button class="btn" onclick="zoomMap(-.1)">−</button></div></div>`}
let mapMoved=false;function keepRender(){let y=window.scrollY;render(true);requestAnimationFrame(()=>window.scrollTo(0,y))}function fieldTap(id){if(editMap||mapMoved)return;let p=S.plots[id];if(p.crop&&Date.now()>=p.end)harvest(id);else if(!p.crop)plant(id)}function plant(id){let c=crops[seed],p=S.plots[id];if(c.level>S.level)return;if((S.seeds[seed]||0)<1)return toast('Faltam sementes de '+c.name);S.seeds[seed]--;p.crop=seed;let bonus=Math.min(.5,(S.equipment.tractor+S.equipment.sprinkler)*.05);p.end=Date.now()+c.time*(1-bonus)*1000;save();keepRender()}function harvest(id){let p=S.plots[id],c=crops[p.crop];if(Date.now()<p.end)return;if(siloCount()+3>S.siloCap)return toast('Silo cheio');S.inv[p.crop]=(S.inv[p.crop]||0)+3;addXP(c.xp);p.crop=null;p.end=0;save();keepRender()}
function toggleMapEdit(){editMap=!editMap;keepRender();toast(editMap?'Arraste os campos para organizar':'Posições salvas')}function zoomMap(d){S.mapCamera.z=Math.max(.45,Math.min(1.35,S.mapCamera.z+d));applyMapTransform();save()}function applyMapTransform(){let w=document.getElementById('farmWorld');if(w)w.style.transform=`translate(${S.mapCamera.x}px,${S.mapCamera.y}px) scale(${S.mapCamera.z})`}
function bindFarmWorld(){let v=document.getElementById('farmViewport');if(!v)return;v.onpointerdown=e=>{if(e.target.closest('.farmHud,.zoomBox'))return;let f=e.target.closest('[data-field]');mapMoved=false;mapDrag={sx:e.clientX,sy:e.clientY,x:S.mapCamera.x,y:S.mapCamera.y,field:editMap&&f?Number(f.dataset.field):null,fx:f?S.mapLayout.fields[f.dataset.field].x:0,fy:f?S.mapLayout.fields[f.dataset.field].y:0,el:f};v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(!mapDrag)return;let dx=e.clientX-mapDrag.sx,dy=e.clientY-mapDrag.sy;if(Math.abs(dx)+Math.abs(dy)>6)mapMoved=true;if(mapDrag.field!==null){let p=S.mapLayout.fields[mapDrag.field];p.x=Math.max(0,Math.min(1720,mapDrag.fx+dx/S.mapCamera.z));p.y=Math.max(0,Math.min(1120,mapDrag.fy+dy/S.mapCamera.z));mapDrag.el.style.left=p.x+'px';mapDrag.el.style.top=p.y+'px'}else{S.mapCamera.x=mapDrag.x+dx;S.mapCamera.y=mapDrag.y+dy;applyMapTransform()}};let finish=()=>{if(mapDrag){save();mapDrag=null;setTimeout(()=>mapMoved=false,80)}};v.onpointerup=finish;v.onpointercancel=finish}
function openFarmPanel(type){let body=document.getElementById('farmModalBody'),now=Date.now();if(type==='orders'){ensureOrders();body.innerHTML=`<h2>🚚 Clientes da fazenda</h2><div class="sub">Entregue os produtos diretamente aos clientes.</div>${S.orders.map(o=>`<article class="card"><div><b>${Object.entries(o.items).map(([k,q])=>`${products[k]?.icon||crops[k]?.icon||rawGoods[k]?.icon||'📦'} ${q}x ${products[k]?.name||crops[k]?.name||rawGoods[k]?.name||k}`).join(' · ')}</b></div><div class="sub">Pagamento: 🪙 ${o.value} · ⭐ ${o.xp}</div><button class="btn" onclick="deliverMapOrder(${o.id})">Entregar</button></article>`).join('')}` }else{let d={chicken:['🐔','Galinheiro','ovo','ovos',60],pig:['🐷','Chiqueiro','bacon','bacon',90],cow:['🐄','Estábulo','leite','leite',120]}[type],left=Math.max(0,Math.ceil((S.animalReady[type]-now)/1000));body.innerHTML=`<h2>${d[0]} ${d[1]}</h2><p>${S.animals[type]} animal(is) · produz ${d[3]}</p><p><b>${left<=0?'Produção pronta!':'Pronto em '+left+'s'}</b></p><button class="btn" ${left>0?'disabled':''} onclick="collectAnimal('${type}','${d[2]}',${d[4]});openFarmPanel('${type}')">Recolher</button> <button class="btn yellow" onclick="buyAnimal('${type}');openFarmPanel('${type}')">Comprar animal</button>`}document.getElementById('farmModal').classList.add('on')}function closeFarmPanel(){document.getElementById('farmModal').classList.remove('on')}function deliverMapOrder(id){deliverOrder(id);openFarmPanel('orders')}
function animals(){let now=Date.now(),types=[['chicken','Galinhas','🐔','ovo','Ovos',60],['pig','Porcos','🐷','bacon','Bacon',90],['cow','Vacas','🐄','leite','Leite',120]];return `<section class="hero"><h1>🐾 Animais</h1><div class="sub">Cuide dos animais e recolha produtos.</div></section>${types.map(t=>{let left=Math.max(0,Math.ceil((S.animalReady[t[0]]-now)/1000)),ready=left<=0;return `<article class="card"><div class="row between"><div><h3>${t[2]} ${t[1]}</h3><div class="sub">${S.animals[t[0]]} animal(is) · produz ${t[4]}</div></div><b>${ready?'Pronto':left+'s'}</b></div><div class="row" style="margin-top:10px"><button class="btn" ${ready?'':'disabled'} onclick="collectAnimal('${t[0]}','${t[3]}',${t[5]})">Recolher</button><button class="btn yellow" onclick="buyAnimal('${t[0]}')">Comprar · 🪙 ${S.animals[t[0]]*300}</button></div></article>`}).join('')}`}
function collectAnimal(type,item,time){if(Date.now()<S.animalReady[type])return;let q=S.animals[type];if(barnCount()+q>S.barnCap)return toast('Celeiro cheio');S.inv[item]=(S.inv[item]||0)+q;S.animalReady[type]=Date.now()+time*1000;addXP(q*3);save();render()}function buyAnimal(type){let cost=S.animals[type]*300;if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;S.animals[type]++;save();render()}
const machineLevels={padaria:2,racao:3,pipoqueira:4,laticinio:5,acucareiro:6,sucos:11};function machineFor(k){return{pao:'padaria',bolo:'padaria',torta:'padaria',racao:'racao',pipoca:'pipoqueira',creme:'laticinio',queijo:'laticinio',acucar:'acucareiro',suco:'sucos'}[k]}function production(){let now=Date.now(),open=Object.entries(S.machines).filter(([mk])=>S.level>=machineLevels[mk]);return `<section class="hero"><h1>🏭 Produção</h1><div class="sub">Transforme colheitas e aumente a fila de cada máquina.</div></section>${open.map(([mk,m])=>{let available=Object.entries(products).filter(([k,p])=>machineFor(k)===mk&&p.level<=S.level);let cost=m.cap*2500;return `<article class="card"><div class="row between"><h3>${m.icon} ${m.name}</h3><span class="badge">Fila ${m.queue.length}/${m.cap}</span></div>${m.queue.map((q,i)=>{let p=products[q.product],left=Math.max(0,Math.ceil((q.end-now)/1000));return `<div class="row between" style="padding:8px 0"><span>${p.icon} ${p.name}</span>${i===0&&left<=0?`<button class="btn" onclick="collectProduct('${mk}')">Recolher</button>`:`<span>${left}s</span>`}</div>`}).join('')||'<div class="sub">Máquina livre</div>'}<div class="chips" style="margin-top:10px">${available.map(([k,p])=>`<button class="chip" onclick="makeProduct('${mk}','${k}')">${p.icon} ${p.name}</button>`).join('')}</div><button class="btn yellow" style="margin-top:10px" onclick="upgradeQueue('${mk}')">Aumentar fila +1 · 🪙 ${money(cost)}</button></article>`}).join('')}`}
function makeProduct(mk,k){let m=S.machines[mk],p=products[k];if(m.queue.length>=m.cap)return toast('Fila cheia');for(let [i,q] of Object.entries(p.needs))if((S.inv[i]||0)<q)return toast('Falta: '+(products[i]?.name||crops[i]?.name||i));for(let [i,q] of Object.entries(p.needs))S.inv[i]-=q;let start=m.queue.length?m.queue[m.queue.length-1].end:Date.now();m.queue.push({product:k,end:start+p.time*1000});save();render()}function collectProduct(mk){let m=S.machines[mk],q=m.queue[0];if(!q||Date.now()<q.end)return;let p=products[q.product];if(barnCount()+1>S.barnCap)return toast('Celeiro cheio');S.inv[q.product]=(S.inv[q.product]||0)+1;m.queue.shift();addXP(p.xp);save();render()}function upgradeQueue(mk){let m=S.machines[mk],cost=m.cap*2500;if(m.cap>=10)return toast('Fila no máximo');if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;m.cap++;save();render()}
function ensureOrders(){while(S.orders.length<6){let keys=[...Object.keys(crops),...Object.keys(products),...Object.keys(rawGoods)].filter(k=>(crops[k]?.level||products[k]?.level||rawGoods[k]?.level)<=S.level),items={};for(let i=0;i<1+Math.floor(Math.random()*2);i++){let k=keys[Math.floor(Math.random()*keys.length)];items[k]=(items[k]||0)+1+Math.floor(Math.random()*3)}let value=Object.entries(items).reduce((n,[k,q])=>n+q*(crops[k]?.sell||products[k]?.value||rawGoods[k]?.value||10),0);S.orders.push({id:Date.now()+Math.random(),items,value:Math.round(value*1.4),xp:Math.max(5,Math.round(value/4))})}}
function orders(){ensureOrders();return `<section class="hero"><h1>🚚 Quadro de pedidos</h1><div class="sub">Veja o pedido e compare com seu estoque.</div></section>${S.orders.map(o=>`<article class="card"><div class="row between"><div><h3>Pedido da cidade</h3>${Object.entries(o.items).map(([k,q])=>`<div class="sub">${products[k]?.icon||crops[k]?.icon} ${products[k]?.name||crops[k]?.name}: precisa <b>${q}</b> · estoque <b style="color:${(S.inv[k]||0)>=q?'#31843a':'#d3483e'}">${S.inv[k]||0}</b></div>`).join('')}</div><div><b>🪙 ${o.value}</b><div class="sub">⭐ ${o.xp} XP</div></div></div><button class="btn" style="margin-top:10px" onclick="deliverOrder(${o.id})">Entregar pedido</button></article>`).join('')}`}
function deliverOrder(id){let o=S.orders.find(x=>x.id===id);for(let [k,q] of Object.entries(o.items))if((S.inv[k]||0)<q)return toast('Faltam produtos');for(let [k,q] of Object.entries(o.items))S.inv[k]-=q;S.coins+=o.value;addXP(o.xp);S.completed++;S.orders=S.orders.filter(x=>x.id!==id);save();render();toast('Pedido entregue!')}
function store(){return `<section class="hero"><h1>🛒 Loja da fazenda</h1><div class="sub">Compre sementes sem misturar com os produtos colhidos.</div></section>${Object.entries(crops).filter(([,c])=>c.level<=S.level).map(([k,c])=>`<article class="card"><div class="row between"><div><h3>${c.icon} Sementes de ${c.name}</h3><div class="sub">Sementes: ${S.seeds[k]||0} · Colhidos: ${S.inv[k]||0}</div></div><div><input id="buy${k}" class="field" style="width:75px" type="number" min="1" value="5"><button class="btn yellow" onclick="buySeeds('${k}')">Comprar</button></div></div></article>`).join('')}`}
function buySeeds(k){let q=Math.max(1,Math.floor(Number(document.getElementById('buy'+k).value)||1)),cost=q*crops[k].buy;if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;S.seeds[k]=(S.seeds[k]||0)+q;save();render()}
function inventory(){let silo=Object.entries(S.inv).filter(([k,q])=>q>0&&siloItems.has(k)),barn=Object.entries(S.inv).filter(([k,q])=>q>0&&!siloItems.has(k));let cards=a=>a.map(([k,q])=>`<article class="card"><div class="row between"><h3>${products[k]?.icon||crops[k]?.icon||treeTypes[k]?.icon||'📦'} ${products[k]?.name||crops[k]?.name||treeTypes[k]?.fruit||k}</h3><b>${q}</b></div></article>`).join('')||'<div class="empty">Nenhum item armazenado.</div>';return `<section class="hero"><h1>📦 Armazenamento</h1><div class="sub">Cada item é contado uma única vez.</div></section><div class="section"><h2>🌱 Sementes</h2><span class="badge">estoque separado</span></div><div class="grid">${Object.entries(S.seeds).map(([k,q])=>`<article class="card"><div class="row between"><h3>${crops[k].icon} ${crops[k].name}</h3><b>${q}</b></div></article>`).join('')}</div><div class="section"><h2>🌾 Silo</h2><span class="badge">${siloCount()}/${S.siloCap}</span></div>${cards(silo)}<div class="section"><h2>📦 Celeiro</h2><span class="badge">${barnCount()}/${S.barnCap}</span></div>${cards(barn)}<button class="btn yellow" onclick="upgradeStorage()">Aumentar ambos +25 · 🪙 ${S.barnCap*20}</button>`}function upgradeStorage(){let c=S.barnCap*20;if(S.coins<c)return toast('Moedas insuficientes');S.coins-=c;S.barnCap+=25;S.siloCap+=25;save();render()}
function market(){return `<section class="hero"><h1>🏪 Banca de vendas</h1><div class="sub">Venda produtos diretamente aos visitantes.</div></section>${Object.entries(S.inv).filter(([,q])=>q>0).map(([k,q],i)=>`<article class="card"><div class="row between"><div><h3>${products[k]?.icon||crops[k]?.icon} ${products[k]?.name||crops[k]?.name}</h3><div class="sub">Disponível ${q} · valor ${crops[k]?.sell||products[k]?.value}</div></div><div><input id="sell${i}" class="field" style="width:70px" type="number" min="1" value="1"><button class="btn" onclick="sellItem('${k}',${i})">Vender</button></div></div></article>`).join('')||'<div class="empty">Sem produtos para vender.</div>'}`}
function sellItem(k,i){let q=Math.max(1,Math.floor(Number(document.getElementById('sell'+i).value)||1));if(S.inv[k]<q)return toast('Quantidade indisponível');let value=(crops[k]?.sell||products[k]?.value||1)*q;S.inv[k]-=q;S.coins+=value;save();render()}
function expand(){let cost=S.plots.length*150;return `<section class="hero"><h1>🗺️ Expansões</h1><div class="sub">Abra novos espaços na sua fazenda.</div></section><article class="card"><div class="row between"><div><h3>🌱 Novo terreno</h3><div class="sub">+3 espaços para plantio</div></div><button class="btn yellow" onclick="expandPlots()">🪙 ${cost}</button></div></article>`}function expandPlots(){let cost=S.plots.length*150;if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;let n=S.plots.length;for(let i=0;i<3;i++){let id=n+i;S.plots.push({id,crop:null,end:0});S.mapLayout.fields[id]={x:390+(id%12)*78,y:220+Math.floor(id/12)*78}}save();render()}
const treeTypes={maca:{name:'Macieira',fruit:'Maçã',icon:'🍎',level:4,cost:500,time:180},laranja:{name:'Laranjeira',fruit:'Laranja',icon:'🍊',level:6,cost:800,time:300},cereja:{name:'Cerejeira',fruit:'Cereja',icon:'🍒',level:9,cost:1200,time:420}};function orchard(){let now=Date.now(),shop=Object.entries(treeTypes).map(([k,t])=>`<article class="card"><div class="row between"><div><h3>${t.icon} ${t.name}</h3><div class="sub">Nível ${t.level} · rende 3 frutas por colheita</div></div><button class="btn yellow" ${S.level<t.level?'disabled':''} onclick="buyTree('${k}')">🪙 ${money(t.cost)}</button></div></article>`).join('');let trees=S.trees.map(t=>{let x=treeTypes[t.type],left=Math.max(0,Math.ceil((t.end-now)/1000)),dead=t.harvests>=3;return `<article class="card"><div class="row between"><div><h3>${x.icon} ${x.name}</h3><div class="sub">Colheitas ${t.harvests}/3</div></div>${dead?`<button class="btn red" onclick="removeTree(${t.id})">Cortar</button>`:left<=0?`<button class="btn" onclick="harvestTree(${t.id})">Colher 3</button>`:`<b>${left}s</b>`}</div></article>`}).join('');return `<section class="hero"><h1>🌳 Pomar</h1><div class="sub">Cada árvore dá 3 colheitas de 3 frutas.</div></section><div class="section"><h2>Minhas árvores</h2><span class="badge">${S.trees.length}</span></div>${trees||'<div class="empty">Compre sua primeira árvore.</div>'}<div class="section"><h2>Viveiro</h2></div>${shop}`}
function buyTree(k){let t=treeTypes[k];if(S.level<t.level)return toast('Libera no nível '+t.level);if(S.coins<t.cost)return toast('Moedas insuficientes');S.coins-=t.cost;S.trees.push({id:Date.now()+Math.random(),type:k,end:Date.now()+t.time*1000,harvests:0});save();render()}function harvestTree(id){let t=S.trees.find(x=>x.id===id);if(!t||Date.now()<t.end||t.harvests>=3)return;let x=treeTypes[t.type];if(siloCount()+3>S.siloCap)return toast('Silo cheio');S.inv[t.type]=(S.inv[t.type]||0)+3;t.harvests++;t.end=Date.now()+x.time*1000;addXP(10);save();render()}function removeTree(id){S.trees=S.trees.filter(x=>x.id!==id);save();render()}
function equipment(){let list=[['tractor','🚜','Trator',5],['sprinkler','💦','Aspersor',7]];return `<section class="hero"><h1>🚜 Máquinas e equipamentos</h1><div class="sub">Cada melhoria reduz 5% do tempo da plantação, até 50% no total.</div></section>${list.map(([k,icon,name,level])=>{let lv=S.equipment[k],cost=(lv+1)*50000;return `<article class="card"><div class="row between"><div><h3>${icon} ${name}</h3><div class="sub">Nível ${lv}/5 · desbloqueia no nível ${level}</div></div><button class="btn yellow" ${S.level<level||lv>=5?'disabled':''} onclick="upgradeEquipment('${k}',${level})">Melhorar · 🪙 ${money(cost)}</button></div></article>`}).join('')}`}
function upgradeEquipment(k,level){let lv=S.equipment[k];if(S.level<level)return toast('Ainda não desbloqueado');if(lv>=5)return toast('Nível máximo');let cost=(lv+1)*50000;if(S.coins<cost)return toast('Moedas insuficientes');S.coins-=cost;S.equipment[k]++;save();render()}
function settings(){return `<section class="hero"><h1>⚙️ Configurações</h1><div class="sub">O jogo salva automaticamente neste navegador.</div></section><article class="card"><h3>Salvar progresso</h3><button class="btn" onclick="save();toast('Jogo salvo')">Salvar agora</button></article><article class="card"><h3>Recomeçar</h3><button class="btn red" onclick="if(confirm('Apagar todo o progresso?')){S=fresh();save();go('farm')}">Apagar progresso</button></article>`}
function render(preservePosition=false){header();nav();let fn={farm,animals,production,orders,store,orchard,equipment,inventory,market,expand,settings}[page]||farm;document.getElementById('view').innerHTML=fn();if(page==='farm')requestAnimationFrame(bindFarmWorld);if(!preservePosition)window.scrollTo(0,0)}function offline(){let mins=Math.min(480,Math.floor((Date.now()-(S.lastSeen||Date.now()))/60000));if(mins>0)toast('🌙 Você ficou '+mins+' minuto(s) fora. As produções continuaram!');save()}offline();render();let farmTick=0;setInterval(()=>{save();farmTick++;if(page==='farm'){if(!mapDrag&&farmTick%3===0)render(true)}else if(['animals','production','orchard'].includes(page)){let y=scrollY;render(true);scrollTo(0,y)}else header()},1000);
</script></body></html>
